    "title": "Proposed Commerce Companion API Contract",
    "version": "1.0.0-design",
    "description": "Documentation-only proposed contract. No endpoints implemented or tested. Native WooCommerce Store API is referenced separately and not redefined. Money and object ownership follow docs/04-data. Every mutation requires resource authorization and idempotency; cookie mutations require WordPress REST nonce as CSRF defense, never identity. Cookie-authenticated REST requests, including GET, require WordPress REST nonce per SRC-G011. Human step-up endpoints reject service-credential-only calls. Preview bodies capped256KiB; ordinary mutation bodies64KiB; imports use staged file reference20MB."
  },
