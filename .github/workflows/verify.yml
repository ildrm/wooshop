name: Local product verification
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify available runner tools
        run: |
          php --version
          node --version
          python3 --version
          docker compose version
      - name: Static and pure domain checks
        run: python3 tools/check.py
      - name: Install locked browser test dependency without lifecycle scripts
        run: npm ci --ignore-scripts --no-fund
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Verify reviewed WordPress inputs and start isolated stores
        run: |
          python3 tools/bootstrap.py
          python3 tools/dev.py up
          python3 tools/dev.py install
      - name: Real WordPress integration
        run: |
          python3 tools/dev.py wp outdoor eval-file /workspace/tools/seed.php outdoor configure-profile
          python3 tools/dev.py wp smart-home eval-file /workspace/tools/seed.php smart-home configure-profile
          python3 tools/dev.py wp outdoor wc hpos enable --with-sync
          python3 tools/integration.py --site outdoor
      - name: Native browser scenarios on synthetic fixtures
        run: |
          google-chrome --version
          npx playwright test storefront.spec.js settings.spec.js
      - name: Development archives and hygiene
        run: |
          python3 tools/package.py
          python3 tools/security.py
          python3 tools/dev.py package-site
          python3 tools/dev.py wp package-check eval-file /workspace/tools/seed.php neutral configure-profile
          python3 tools/dev.py wp package-check wc hpos enable --with-sync
          python3 tools/integration.py --site package-check
      - name: Stop local fixture services
        if: always()
        run: python3 tools/dev.py stop
